name: Build and Deploy

on:
  push:
    branches:
      - main
      - develop

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: "stage"
        type: choice
        options:
          - stage
          - prod
      aws_region:
        description: "AWS Region"
        required: false
        default: "us-east-2"
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ github.event.inputs.aws_region || 'us-east-2' }}
  ENVIRONMENT: >-
    ${{
      github.event.inputs.environment
      || (github.ref == 'refs/heads/main' && 'prod')
      || 'stage'
    }}

jobs:
  deploy:
    name: Deploy to AWS (CloudFront)
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod') || 'stage' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-LingpadAIFE

      - name: Deploy with SST (OpenNext + CloudFront)
        run: npx sst deploy --stage ${{ env.ENVIRONMENT }}
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL }}
          LINGPAD_AGENT_API_URL: ${{ vars.LINGPAD_AGENT_API_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${{ vars.NEXT_PUBLIC_CLERK_SIGN_IN_URL || '/sign-in' }}
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${{ vars.NEXT_PUBLIC_CLERK_SIGN_UP_URL || '/sign-up' }}
          NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${{ vars.NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL || '/' }}
          NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${{ vars.NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL || '/' }}
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN: ${{ secrets.NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
